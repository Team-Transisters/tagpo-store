<main class="container py-5">
    <h1>Contact Us</h1>
    <form id="contactForm">
        <div class="mb-3">
            <label for="contactName" class="form-label">Name</label>
            <input type="text" class="form-control" id="contactName" required autocomplete="name">
        </div>
        <div class="mb-3">
            <label for="contactEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="contactEmail" required autocomplete="email">
        </div>
         <div class="mb-3">
            <label for="contactSubject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="contactSubject" required>
        </div>
        <div class="mb-3">
            <label for="contactPurpose" class="form-label">Purpose</label>
            <textarea class="form-control" id="contactPurpose" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
</main>
